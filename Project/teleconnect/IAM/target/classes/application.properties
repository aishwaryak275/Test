# Application
spring.application.name=IAM

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/tele?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate - auto creates all tables from @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server port - IAM runs on 8081 in monorepo
server.port=8081

# JWT access token - 30 minutes
jwt.secret=TeleConnect_Super_Secret_Key_2024_IAM_Min32Chars_XYZ
jwt.expiration=1800000

# Threshold - renew token when less than 10 minutes remain
jwt.renewal.threshold.ms=600000

# Default staff password set by admin
app.default.staff.password=Teleconnect@123


app.default.admin.email=admin@teleconnect.com
app.default.admin.password=Admin@123

