spring.application.name=notification

spring.datasource.url=jdbc:mysql://localhost:3306/telecommunication
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8086

app.scheduler.usage-alert.cron=0 0 * * * *
app.scheduler.plan-expiry.cron=0 0 8 * * *
app.scheduler.invoice-due.cron=0 0 9 * * *

app.notification.plan-expiry-reminder-days=3
app.notification.invoice-due-reminder-days=2