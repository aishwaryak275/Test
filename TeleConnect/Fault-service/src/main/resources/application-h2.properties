# ── Local / demo profile: run the module on an in-memory H2 database ──────────
# Activate with:  --spring.profiles.active=h2
# Lets the app boot and serve all 11 endpoints without a running MySQL instance.
# The default (no-profile) configuration in application.properties still targets MySQL.
spring.datasource.url=jdbc:h2:mem:teleconnect;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=root

# Hibernate builds the schema from the entities for this in-memory run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

server.port=8090
server.servlet.context-path=/teleConnect
spring.application.name=fault
