spring.application.name=analytics-service

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/teleconnect_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# Server
server.port=8089
server.servlet.context-path=/teleConnect

# Analytics thresholds
analytics.churn.threshold=5.0
analytics.arpu.decline.threshold=10.0
analytics.sla.breach.threshold=90.0

# Scheduling
spring.task.scheduling.pool.size=5
